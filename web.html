<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Article Builder & SEO HTML Exporter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            editor: {
              dark: '#0b0f17',
              card: '#151b26',
              accent: '#6366f1',
              emerald: '#10b981'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-editor-dark text-gray-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-editor-dark/90 backdrop-blur-md border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-pen-nib text-sm"></i>
        </div>
        <div>
          <span class="text-lg font-black tracking-tight text-white block leading-none">SEO<span class="text-indigo-400">BUILDER</span></span>
          <span class="text-[10px] text-gray-400 tracking-wider uppercase font-semibold">Universal Article & HTML Exporter</span>
        </div>
      </div>
      <div class="flex items-center space-x-3 text-xs font-semibold">
        <span class="px-3 py-1.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 flex items-center space-x-1">
          <i class="fa-solid fa-bolt text-[10px]"></i>
          <span>Multi-Section Generator</span>
        </span>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- LEFT PANEL: EDITOR FORM -->
    <div class="lg:col-span-5 space-y-6">
      
      <!-- GLOBAL META DATA -->
      <div class="bg-editor-card border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
        <h2 class="text-base font-bold text-white flex items-center space-x-2">
          <i class="fa-solid fa-heading text-indigo-400"></i>
          <span>Pengaturan Artikel SEO</span>
        </h2>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Judul Utama Artikel (H1 Target Keyword)</label>
          <input type="text" id="articleTitle" oninput="updatePreview()" placeholder="Misal: Panduan Lengkap Strategi Digital Marketing 2026" class="w-full bg-slate-900 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-400">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Deskripsi Singkat Meta (Meta Description)</label>
          <textarea id="metaDesc" oninput="updatePreview()" rows="2" placeholder="Tuliskan deskripsi ringkas 150-160 karakter untuk Google Search Result..." class="w-full bg-slate-900 border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-400 resize-none"></textarea>
        </div>
      </div>

      <!-- SECTION ADDER -->
      <div class="bg-editor-card border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-bold text-white flex items-center space-x-2">
            <i class="fa-solid fa-layer-group text-indigo-400"></i>
            <span>Struktur Sub-Judul (H2) & Konten</span>
          </h3>
          <button onclick="addSection()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
            <i class="fa-solid fa-plus text-[10px]"></i>
            <span>Tambah Sub-Judul</span>
          </button>
        </div>

        <div id="sectionContainer" class="space-y-4 max-h-[380px] overflow-y-auto pr-1">
          <!-- Dynamic Sections will go here -->
        </div>
      </div>

      <!-- EXPORT OPTIONS -->
      <div class="bg-editor-card border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center space-x-2">
          <i class="fa-solid fa-sliders text-emerald-400"></i>
          <span>Pengaturan Ekspor HTML</span>
        </h3>

        <div class="space-y-2 text-xs">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="optToc" checked onchange="updatePreview()" class="rounded border-gray-700 bg-slate-900 text-indigo-500 focus:ring-0">
            <span class="text-gray-300">Buat Table of Contents (Daftar Isi) Otomatis</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="optSchema" checked class="rounded border-gray-700 bg-slate-900 text-indigo-500 focus:ring-0">
            <span class="text-gray-300">Tambahkan Schema.org Article (JSON-LD)</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="optClean" checked onchange="updatePreview()" class="rounded border-gray-700 bg-slate-900 text-indigo-500 focus:ring-0">
            <span class="text-gray-300">Sertakan Styling Kebersihan Khas SEO (Tailwind CDN)</span>
          </label>
        </div>

        <button onclick="exportArticleHtml()" id="btnExport" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-500/20 text-xs flex items-center justify-center space-x-2">
          <i class="fa-solid fa-file-arrow-down"></i>
          <span>Download SEO HTML File (.html)</span>
        </button>
      </div>

    </div>

    <!-- RIGHT PANEL: LIVE PREVIEW -->
    <div class="lg:col-span-7 flex flex-col">
      <div class="bg-editor-card border border-gray-800 rounded-2xl p-6 shadow-xl flex-grow flex flex-col">
        <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-eye text-indigo-400 text-sm"></i>
            <span class="text-sm font-bold text-white">Live Article Preview</span>
          </div>
          <span id="wordCount" class="text-[11px] font-mono text-gray-400 bg-slate-900 px-2.5 py-1 rounded-md border border-gray-800">0 Kata</span>
        </div>

        <div id="previewContainer" class="flex-grow bg-slate-900/60 border border-gray-800/80 rounded-xl p-6 overflow-y-auto max-h-[600px] text-gray-300 text-sm leading-relaxed space-y-4">
          <!-- Dynamic Content Rendered Here -->
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-950 border-t border-gray-800 py-6 text-center text-xs text-gray-500">
    <p>© 2026 Universal SEO Builder • Format HTML Murni untuk Google Indexing & GitHub Hosting</p>
  </footer>

  <!-- SCRIPT LOGIC -->
  <script>
    let sectionCount = 0;

    // Inisialisasi awal dengan 2 Section
    window.onload = () => {
      addSection("Pengantar & Latar Belakang", "Tuliskan pendahuluan artikel di sini. Anda bebas mengisikan topik apa saja mulai dari teknologi, bisnis, tutorial, hingga opini.");
      addSection("Pembahasan Utama", "Tambahkan poin-poin penjelasan penting, analisis, atau panduan langkah demi langkah pada bagian ini.");
    };

    function addSection(defaultTitle = "", defaultContent = "") {
      sectionCount++;
      const container = document.getElementById('sectionContainer');
      const secId = `sec_item_${sectionCount}`;

      const div = document.createElement('div');
      div.id = secId;
      div.className = "bg-slate-900/80 border border-gray-800 p-3.5 rounded-xl space-y-2 relative group";
      div.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">Sub-Judul H2 #${sectionCount}</span>
          <button onclick="removeSection('${secId}')" class="text-gray-500 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash-can"></i></button>
        </div>
        <input type="text" class="sec-title w-full bg-slate-950 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-400" placeholder="Judul H2..." value="${defaultTitle}" oninput="updatePreview()">
        <textarea class="sec-content w-full bg-slate-950 border border-gray-700 rounded-lg p-2.5 text-xs text-gray-300 focus:outline-none focus:border-indigo-400 resize-y min-h-[80px]" placeholder="Isi paragraf H2..." oninput="updatePreview()">${defaultContent}</textarea>
      `;
      container.appendChild(div);
      updatePreview();
    }

    function removeSection(id) {
      const el = document.getElementById(id);
      if (el) {
        el.remove();
        updatePreview();
      }
    }

    function updatePreview() {
      const title = document.getElementById('articleTitle').value.trim() || "Judul Artikel Bebas Anda";
      const meta = document.getElementById('metaDesc').value.trim();
      const incToc = document.getElementById('optToc').checked;
      const preview = document.getElementById('previewContainer');

      const secTitles = document.querySelectorAll('.sec-title');
      const secContents = document.querySelectorAll('.sec-content');

      let totalWords = 0;
      let htmlOutput = `<h1 class="text-2xl font-extrabold text-white mb-2 leading-tight">${title}</h1>`;

      if (meta) {
        htmlOutput += `<p class="text-xs text-indigo-300/80 italic mb-4 pb-3 border-b border-gray-800">${meta}</p>`;
      }

      // Generate Table of Contents (TOC)
      if (incToc && secTitles.length > 0) {
        let hasValidTitle = false;
        let tocHtml = `<div class="bg-slate-800/80 border border-gray-700 p-4 rounded-xl mb-6"><div class="font-bold text-xs uppercase tracking-wider text-indigo-400 mb-2"><i class="fa-solid fa-list-ul mr-1"></i> Daftar Isi Artikel</div><ul class="space-y-1 text-xs text-gray-300 font-medium">`;
        
        secTitles.forEach((tInput, idx) => {
          const val = tInput.value.trim();
          if (val) {
            hasValidTitle = true;
            tocHtml += `<li><a href="#section-${idx}" class="hover:text-indigo-400 transition">${idx + 1}. ${val}</a></li>`;
          }
        });
        tocHtml += `</ul></div>`;
        if (hasValidTitle) htmlOutput += tocHtml;
      }

      // Generate Sections Content
      secTitles.forEach((tInput, idx) => {
        const h2Text = tInput.value.trim();
        const bodyText = secContents[idx].value.trim();

        if (h2Text || bodyText) {
          totalWords += (h2Text + " " + bodyText).split(/\s+/).filter(x => x.length > 0).length;

          htmlOutput += `
            <section id="section-${idx}" class="space-y-2 pt-2">
              ${h2Text ? `<h2 class="text-lg font-bold text-indigo-300 border-b border-gray-800/80 pb-1">${h2Text}</h2>` : ''}
              ${bodyText ? `<p class="text-gray-300 leading-relaxed text-sm whitespace-pre-line">${bodyText}</p>` : ''}
            </section>
          `;
        }
      });

      preview.innerHTML = htmlOutput;
      document.getElementById('wordCount').innerText = `${totalWords} Kata`;
    }

    function exportArticleHtml() {
      const title = document.getElementById('articleTitle').value.trim() || "Artikel SEO";
      const meta = document.getElementById('metaDesc').value.trim() || title;
      const includeSchema = document.getElementById('optSchema').checked;
      const previewContent = document.getElementById('previewContainer').innerHTML;

      const schemaScript = includeSchema ? `
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "${title.replace(/"/g, '\\"')}",
      "description": "${meta.replace(/"/g, '\\"')}",
      "datePublished": "${new Date().toISOString()}",
      "author": {
        "@type": "Organization",
        "name": "SEO Universal Exporter"
      }
    }
    <\/script>` : '';

      const fullCode = `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title}</title>
  <meta name="description" content="${meta.replace(/"/g, '&quot;')}">
  <script src="https://cdn.tailwindcss.com"><\/script>
  ${schemaScript}
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased py-10 px-4 sm:px-6">
  <article class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-200 space-y-4">
    ${previewContent}
  </article>
</body>
</html>`;

      const blob = new Blob([fullCode], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title.toLowerCase().replace(/[^a-z0-9]/g, '-')}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
